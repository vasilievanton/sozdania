<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Насколько ты тревожный родитель?</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .quiz-progress {
      height: 6px;
      background: var(--c-border);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .quiz-progress__fill {
      height: 100%;
      background: var(--c-primary);
      transition: width .3s ease;
    }
    .scale-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin: 16px 0 8px;
    }
    .scale-btn {
      flex: 1;
      aspect-ratio: 1;
      max-width: 56px;
      border: 2px solid var(--c-border);
      border-radius: 8px;
      background: var(--c-surface);
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      color: var(--c-text-muted);
      transition: border-color .15s, background .15s, color .15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .scale-btn:hover { border-color: var(--c-primary); color: var(--c-primary); background: #f0f4ff; }
    .scale-btn.selected { border-color: var(--c-primary); background: var(--c-primary); color: white; }
    .scale-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--c-text-muted);
      margin-bottom: 20px;
    }

    .result-card {
      text-align: center;
      padding: 32px 24px;
    }
    .result-card__icon { font-size: 52px; margin-bottom: 12px; }
    .result-card__level { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .result-card__score { font-size: 13px; color: var(--c-text-muted); margin-bottom: 16px; }
    .result-card__desc { font-size: 15px; color: var(--c-text-muted); line-height: 1.6; margin-bottom: 20px; }
    .result-tip {
      border-radius: 8px;
      padding: 14px 16px;
      font-size: 13px;
      line-height: 1.55;
      text-align: left;
      margin-bottom: 20px;
    }
    .result-tip--low    { background: #e6f2e9; border: 1px solid #b8d6bf; color: #1f5a2c; }
    .result-tip--medium { background: #fff4e0; border: 1px solid #e6c98b; color: #6b4a18; }
    .result-tip--high   { background: #fbe8e8; border: 1px solid #e6b8b8; color: #6b1818; }
  </style>
</head>
<body data-mode="user">
  <main class="app-main app-main--narrow">
    <div class="breadcrumb"><a href="map.html">← На карту</a></div>
    <h1>Насколько ты тревожный родитель?</h1>
    <p class="muted">6 утверждений · Оцените от 1 («совсем не про меня») до 5 («очень про меня»)</p>

    <div id="quiz-section">
      <div class="quiz-progress">
        <div class="quiz-progress__fill" id="progress-fill" style="width:0%"></div>
      </div>

      <div class="card" id="question-card">
        <p id="q-num" class="muted" style="font-size:13px; margin-bottom:8px;"></p>
        <h3 id="q-text"></h3>

        <div class="scale-row" id="scale-row"></div>
        <div class="scale-labels">
          <span>1 — совсем не про меня</span>
          <span>5 — очень про меня</span>
        </div>

        <div class="btn-row">
          <button class="btn btn--primary" id="btn-next" disabled>Далее →</button>
        </div>
      </div>
    </div>

    <div class="card result-card" id="result-section" style="display:none">
      <div class="result-card__icon" id="r-icon"></div>
      <div class="result-card__level" id="r-level"></div>
      <div class="result-card__score" id="r-score"></div>
      <div class="result-card__desc" id="r-desc"></div>
      <div class="result-tip" id="r-tip"></div>
      <div class="btn-row" style="justify-content:center">
        <a class="btn btn--primary" href="parent-sessions.html">Записаться к специалисту</a>
        <button class="btn btn--ghost" id="btn-retake">Пройти ещё раз</button>
        <a class="btn" href="map.html">На карту</a>
      </div>
    </div>
  </main>
  <script src="../js/tour.js"></script>
  <script src="../js/app.js"></script>
  <script>
    var questions = [
      'Я часто проверяю, всё ли в порядке с ребёнком, даже если явных поводов нет',
      'Когда ребёнок болеет, я думаю о худшем сценарии',
      'Мне сложно отпускать ребёнка гулять или куда-то без меня',
      'Я часто заранее предупреждаю ребёнка об опасностях, которых ещё нет',
      'После конфликтов с ребёнком я долго переживаю и прокручиваю их в голове',
      'Мне кажется, что окружение и другие дети могут плохо повлиять на моего ребёнка'
    ];

    var levelMap = [
      {
        min: 6, max: 15,
        icon: '😌',
        level: 'Низкий уровень тревожности',
        tipClass: 'result-tip--low',
        desc: 'Ваш уровень тревоги за ребёнка — в норме. Вы доверяете ему, даёте пространство и умеете отделять реальные риски от воображаемых.',
        tip: '✅ Продолжайте так же. Если вы замечаете, что в какие-то периоды тревоги становится больше — это нормально, особенно в моменты перемен.'
      },
      {
        min: 16, max: 24,
        icon: '😐',
        level: 'Умеренная тревожность',
        tipClass: 'result-tip--medium',
        desc: 'Умеренная тревожность — это нормально для любящего родителя. Важно замечать, когда беспокойство начинает мешать ребёнку действовать самостоятельно.',
        tip: '💛 Попробуйте технику «остановись и подыши»: перед тем как среагировать на тревожную мысль, сделайте 3 медленных вдоха. Часто этого достаточно, чтобы оценить ситуацию спокойнее.'
      },
      {
        min: 25, max: 30,
        icon: '😔',
        level: 'Высокая тревожность',
        tipClass: 'result-tip--high',
        desc: 'Высокая тревожность может незаметно передаваться ребёнку и ограничивать его опыт. Это не слабость — это сигнал позаботиться о себе.',
        tip: '❤️ Поговорите со специалистом — это признак заботы о себе и ребёнке, а не слабости. На нашей платформе есть онлайн-сессии с психологами по темам детско-родительских отношений.'
      }
    ];

    var current = 0;
    var answers = [];
    var selected = null;

    function renderQuestion() {
      document.getElementById('q-num').textContent = 'Утверждение ' + (current + 1) + ' из ' + questions.length;
      document.getElementById('q-text').textContent = questions[current];
      document.getElementById('progress-fill').style.width = (current / questions.length * 100) + '%';

      var row = document.getElementById('scale-row');
      row.innerHTML = '';
      selected = null;
      document.getElementById('btn-next').disabled = true;

      for (var v = 1; v <= 5; v++) {
        (function(val) {
          var btn = document.createElement('button');
          btn.className = 'scale-btn';
          btn.textContent = val;
          btn.addEventListener('click', function() {
            row.querySelectorAll('.scale-btn').forEach(function(b) { b.classList.remove('selected'); });
            btn.classList.add('selected');
            selected = val;
            document.getElementById('btn-next').disabled = false;
          });
          row.appendChild(btn);
        })(v);
      }
    }

    document.getElementById('btn-next').addEventListener('click', function() {
      if (selected === null) return;
      answers.push(selected);
      current++;
      if (current < questions.length) {
        renderQuestion();
      } else {
        showResult();
      }
    });

    function showResult() {
      var total = answers.reduce(function(a, b) { return a + b; }, 0);
      var level = levelMap[0];
      for (var i = 0; i < levelMap.length; i++) {
        if (total >= levelMap[i].min && total <= levelMap[i].max) { level = levelMap[i]; break; }
      }
      document.getElementById('r-icon').textContent = level.icon;
      document.getElementById('r-level').textContent = level.level;
      document.getElementById('r-score').textContent = 'Ваш результат: ' + total + ' из 30';
      document.getElementById('r-desc').textContent = level.desc;
      var tip = document.getElementById('r-tip');
      tip.textContent = level.tip;
      tip.className = 'result-tip ' + level.tipClass;
      document.getElementById('quiz-section').style.display = 'none';
      document.getElementById('result-section').style.display = '';
    }

    document.getElementById('btn-retake').addEventListener('click', function() {
      current = 0;
      answers = [];
      selected = null;
      document.getElementById('result-section').style.display = 'none';
      document.getElementById('quiz-section').style.display = '';
      renderQuestion();
    });

    renderQuestion();
  </script>
</body>
</html>
