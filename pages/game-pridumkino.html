<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Раскраска — Придумкино</title>
  <link rel="stylesheet" href="../css/main.css">
  <meta http-equiv="refresh" content="0;url=pridumkino-pick.html">
</head>
<body data-mode="user">
  <main class="app-main app-main--narrow">
    <p class="muted">Перенаправление… <a id="link" href="pridumkino-pick.html">Перейти к выбору картинки</a></p>
  </main>
  <script src="../js/pridumkino-proto.js"></script>
  <script src="../js/tour.js"></script>
  <script>
    const P = window.PridumkinoProto;
    const theme = P.getThemeFromQuery();
    const url = theme
      ? P.tourUrl(`pridumkino-pick.html?theme=${theme}`)
      : P.tourUrl("district-pridumkino.html");
    document.getElementById("link").href = url;
    P.goReplace(theme
      ? `pridumkino-pick.html?theme=${theme}`
      : "district-pridumkino.html");
  </script>
</body>
</html>
