<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Карточки-интервью — Болталка</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .interview-wrap {
      max-width: 540px;
      margin: 0 auto;
    }

    /* Mode select */
    .mode-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-4);
      margin-top: var(--space-4);
    }
    @media (max-width: 520px) {
      .mode-grid { grid-template-columns: 1fr; }
    }
    .mode-card {
      position: relative;
      border: 2px solid var(--c-border);
      border-radius: var(--r-lg);
      padding: var(--space-5);
      cursor: pointer;
      background: var(--c-surface);
      text-align: center;
      transition: border-color .15s, background .15s;
      user-select: none;
    }
    .mode-card:hover { border-color: var(--c-primary); background: #f5f8ff; }
    .mode-card.is-done {
      border-color: var(--c-success);
      background: #f0faf2;
    }
    .mode-card__icon { font-size: 40px; margin-bottom: var(--space-3); }
    .mode-card__title { font-size: 17px; font-weight: 700; margin-bottom: var(--space-2); }
    .mode-card__desc { font-size: 13px; color: var(--c-text-muted); line-height: 1.45; }
    .mode-card__check {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 24px;
      height: 24px;
      background: var(--c-success);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }
    .mode-card__btn {
      margin-top: var(--space-4);
      display: inline-block;
      padding: 8px 20px;
      border-radius: var(--r-md);
      font-size: 14px;
      font-weight: 600;
      background: var(--c-primary);
      color: #fff;
    }
    .mode-card.is-done .mode-card__btn {
      background: var(--c-surface-alt);
      color: var(--c-text-muted);
    }

    /* Progress */
    .interview-progress {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin-bottom: var(--space-5);
    }
    .interview-progress__bar {
      flex: 1;
      height: 6px;
      background: var(--c-border);
      border-radius: 999px;
      overflow: hidden;
    }
    .interview-progress__fill {
      height: 100%;
      background: var(--c-primary);
      transition: width .35s ease;
    }
    .interview-progress__count {
      font-size: 13px;
      color: var(--c-text-muted);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    /* Mode label in game */
    .mode-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: var(--space-4);
    }
    .mode-label--child  { background: #e8f0ff; color: #1e3a6f; }
    .mode-label--parent { background: #f4e1fc; color: #5a1a6b; }

    /* Card */
    .interview-card {
      background: var(--c-surface);
      border: 2px solid var(--c-border-strong);
      border-radius: var(--r-lg);
      padding: var(--space-6) var(--space-5);
      min-height: 190px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin-bottom: var(--space-5);
      transition: opacity .18s;
    }
    .interview-card.is-flipping { opacity: 0; }
    .interview-card__question {
      font-size: 21px;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: var(--space-3);
    }
    .interview-card__hint {
      font-size: 14px;
      color: var(--c-text-muted);
      line-height: 1.5;
    }

    /* Nav */
    .interview-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
    }

    /* Done screen */
    .done-screen {
      text-align: center;
      padding: var(--space-5) 0 var(--space-4);
    }
    .done-screen__icon { font-size: 52px; margin-bottom: var(--space-3); }
    .done-screen__pts {
      display: inline-block;
      background: rgba(45,122,62,.10);
      color: var(--c-success);
      border-radius: 4px;
      padding: 4px 14px;
      font-size: 15px;
      font-weight: 700;
      margin: var(--space-3) 0 var(--space-4);
    }
    .done-screen__both {
      background: #fff7d6;
      border: 1px solid #e6d28b;
      border-radius: var(--r-md);
      padding: var(--space-4);
      margin-bottom: var(--space-4);
      font-size: 15px;
      color: #6b4a18;
    }
  </style>
</head>
<body data-mode="user">
  <main class="app-main">
    <div class="breadcrumb"><a href="district-boltalka.html">← В Болталку</a></div>

    <h1>Карточки-интервью</h1>
    <p class="muted">Два набора вопросов — один за ребёнка, один за родителя. Пройдите оба по очереди.</p>

    <div class="interview-wrap">

      <!-- Экран выбора режима -->
      <div id="screen-select">
        <div class="mode-grid">
          <div class="mode-card" id="card-child" onclick="startMode('child')">
            <div class="mode-card__icon">🧒</div>
            <div class="mode-card__title">За ребёнка</div>
            <div class="mode-card__desc">Ребёнок задаёт вопросы родителю — про его детство, ошибки и мечты</div>
            <div class="mode-card__btn" id="btn-child">Начать</div>
          </div>
          <div class="mode-card" id="card-parent" onclick="startMode('parent')">
            <div class="mode-card__icon">👨‍👩</div>
            <div class="mode-card__title">За родителя</div>
            <div class="mode-card__desc">Родитель задаёт вопросы ребёнку — про мечты, радости и желания</div>
            <div class="mode-card__btn" id="btn-parent">Начать</div>
          </div>
        </div>
      </div>

      <!-- Игровой экран -->
      <div id="screen-game" style="display:none;">
        <div class="interview-progress">
          <div class="interview-progress__bar">
            <div class="interview-progress__fill" id="prog-fill" style="width:0%"></div>
          </div>
          <div class="interview-progress__count" id="prog-count"></div>
        </div>

        <div id="mode-label-wrap"></div>

        <div class="interview-card" id="interview-card">
          <div class="interview-card__question" id="card-question"></div>
          <div class="interview-card__hint" id="card-hint"></div>
        </div>

        <div class="interview-nav">
          <button class="btn" id="btn-prev" disabled>← Назад</button>
          <button class="btn btn--primary" id="btn-next">Следующий →</button>
        </div>
      </div>

      <!-- Экран завершения режима -->
      <div id="screen-done" style="display:none;">
        <div class="done-screen">
          <div class="done-screen__icon" id="done-icon"></div>
          <h2 id="done-title"></h2>
          <p class="muted" id="done-desc"></p>
          <div class="done-screen__pts">+15 баллов</div>
          <div id="done-next-wrap"></div>
          <div class="btn-row" style="justify-content:center;" id="done-btns"></div>
        </div>
      </div>

    </div>
  </main>
  <script src="../js/tour.js"></script>
  <script src="../js/app.js"></script>
  <script>
    var CARDS = {
      child: [
        { q: 'Что тебе больше всего нравилось делать летом, когда ты был маленьким?', hint: 'Расскажи конкретный момент, который запомнился' },
        { q: 'Чего ты немного боялся в детстве?', hint: 'Можно смешного или необычного' },
        { q: 'Какую ошибку ты совершил в жизни и что из неё понял?', hint: '' },
        { q: 'Что ты делаешь, когда тебе грустно или трудно?', hint: '' },
        { q: 'Что было самым трудным в твоём детстве?', hint: 'Не обязательно серьёзное' },
        { q: 'Был ли у тебя любимый предмет в школе — и почему?', hint: '' },
        { q: 'Кем ты хотел стать, когда вырастешь?', hint: 'Тогда, в детстве' },
        { q: 'Какой момент из своего детства ты бы хотел прожить ещё раз?', hint: '' },
      ],
      parent: [
        { q: 'Если бы ты мог провести целый день как угодно — без правил и расписания — что бы ты делал?', hint: 'Нет неправильных ответов' },
        { q: 'Что тебя сейчас больше всего радует — прямо в эти дни?', hint: 'Может быть что угодно — большое или маленькое' },
        { q: 'Есть ли что-то, о чём ты хотел бы поговорить, но не знаешь как начать?', hint: 'Можно ответить «нет» — это тоже ответ' },
        { q: 'Что, по-твоему, у тебя получается лучше всего?', hint: 'Не обязательно что-то школьное' },
        { q: 'Если бы ты мог изменить одно правило дома — какое?', hint: 'Отвечай честно, это не ловушка' },
        { q: 'Что тебя больше всего удивило в этом году?', hint: '' },
        { q: 'Чему ты хотел бы научиться?', hint: 'Что угодно — кататься на скейте, готовить, программировать' },
        { q: 'Какой момент из последнего месяца ты бы хотел запомнить?', hint: 'Может быть очень маленьким — это нормально' },
      ],
    };

    var MODE_META = {
      child:  { label: '🧒 Ребёнок спрашивает родителя', cls: 'mode-label--child' },
      parent: { label: '👨‍👩 Родитель спрашивает ребёнка', cls: 'mode-label--parent' },
    };

    var done = { child: false, parent: false };
    var activeMode = null;
    var current = 0;

    function startMode(mode) {
      activeMode = mode;
      current = 0;
      document.getElementById('screen-select').style.display = 'none';
      document.getElementById('screen-done').style.display = 'none';
      document.getElementById('screen-game').style.display = '';
      renderCard();
    }

    function renderCard() {
      var cards = CARDS[activeMode];
      var total = cards.length;
      var c = cards[current];
      var meta = MODE_META[activeMode];

      document.getElementById('prog-fill').style.width = ((current / total) * 100) + '%';
      document.getElementById('prog-count').textContent = (current + 1) + ' / ' + total;

      document.getElementById('mode-label-wrap').innerHTML =
        '<span class="mode-label ' + meta.cls + '">' + meta.label + '</span>';

      document.getElementById('card-question').textContent = c.q;
      document.getElementById('card-hint').textContent = c.hint;

      document.getElementById('btn-prev').disabled = current === 0;
      document.getElementById('btn-next').textContent =
        current === total - 1 ? 'Завершить ✓' : 'Следующий →';
    }

    function flip(dir) {
      var card = document.getElementById('interview-card');
      card.classList.add('is-flipping');
      setTimeout(function () {
        current += dir;
        if (current >= CARDS[activeMode].length) {
          finishMode();
          card.classList.remove('is-flipping');
          return;
        }
        renderCard();
        card.classList.remove('is-flipping');
      }, 180);
    }

    function finishMode() {
      done[activeMode] = true;
      updateModeCards();

      document.getElementById('screen-game').style.display = 'none';
      document.getElementById('screen-done').style.display = '';

      var other = activeMode === 'child' ? 'parent' : 'child';
      var bothDone = done.child && done.parent;

      document.getElementById('done-icon').textContent = bothDone ? '🎉' : '✅';
      document.getElementById('done-title').textContent =
        bothDone ? 'Оба набора пройдены!' : (activeMode === 'child' ? 'Набор ребёнка пройден' : 'Набор родителя пройден');
      document.getElementById('done-desc').textContent =
        bothDone
          ? 'Поговорите об ответах — что удивило, что совпало, что оказалось неожиданным.'
          : 'Теперь передайте устройство ' + (activeMode === 'child' ? 'родителю' : 'ребёнку') + ' и пройдите второй набор.';

      var nextWrap = document.getElementById('done-next-wrap');
      nextWrap.innerHTML = '';
      if (!bothDone) {
        var otherLabel = other === 'child' ? '🧒 За ребёнка' : '👨‍👩 За родителя';
        nextWrap.innerHTML =
          '<button class="btn btn--primary" style="margin-bottom:var(--space-3);" onclick="startMode(\'' + other + '\')">' +
          'Пройти ' + otherLabel + ' →</button><br>';
      }

      var btns = document.getElementById('done-btns');
      btns.innerHTML =
        '<button class="btn btn--ghost" onclick="goSelect()">← К выбору режима</button>' +
        (bothDone ? '<a class="btn btn--primary" href="district-boltalka.html">В Болталку</a>' : '');
    }

    function goSelect() {
      document.getElementById('screen-done').style.display = 'none';
      document.getElementById('screen-select').style.display = '';
    }

    function updateModeCards() {
      ['child', 'parent'].forEach(function(mode) {
        var card = document.getElementById('card-' + mode);
        var btn  = document.getElementById('btn-' + mode);
        if (done[mode]) {
          card.classList.add('is-done');
          card.innerHTML =
            '<div class="mode-card__check">✓</div>' +
            card.innerHTML.replace(/<div class="mode-card__check">.*?<\/div>/, '');
          btn.textContent = 'Пройти снова';
        }
      });
    }

    document.getElementById('btn-next').addEventListener('click', function () { flip(1); });
    document.getElementById('btn-prev').addEventListener('click', function () { flip(-1); });
  </script>
</body>
</html>
